<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FUR:RAID 2026 × SNOWRICE STUDIO. 곧 공개됩니다.">
    <meta name="theme-color" content="#211d2d">
    <title>FUR:RAID 2026 | 곧 공개</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/countdown/style.css">
    <script src="/countdown/page.js" type="module"></script>
  </head>
  <body>
    <div class="background-media" aria-hidden="true">
      <video id="background-video" muted loop playsinline preload="auto" poster="/assets/video/background-poster.jpg">
        <source src="/assets/video/background.webm" type="video/webm">
        <source src="/assets/video/background.mp4" type="video/mp4">
      </video>
    </div>
    <main class="page is-coming-soon countdown-page">
      <div class="coming-soon">
        <div class="coming-soon-content">
          <div class="collaboration" id="collaboration" role="img" aria-label="FUR:RAID 2026과 SNOWRICE STUDIO의 컬래버레이션">
            <img class="collaboration-event" src="/assets/logos/furraid2026_centerlogo.png" alt="" width="1103" height="528">
            <span class="collaboration-mark" aria-hidden="true">×</span>
            <img class="collaboration-studio" src="/assets/logos/Logo_SR1_Title2_white.png" alt="" width="819" height="214">
          </div>
          <h1 id="coming-soon-title">곧 공개됩니다.</h1>
          <div class="countdown-details">
            <div class="countdown" id="countdown" role="timer" aria-live="off" aria-label="공개까지 남은 시간">
              <div class="countdown-unit"><span class="countdown-number" data-value="days">--</span><span class="countdown-label" data-label="days">일</span></div>
              <div class="countdown-unit"><span class="countdown-number" data-value="hours">--</span><span class="countdown-label" data-label="hours">시간</span></div>
              <div class="countdown-unit"><span class="countdown-number" data-value="minutes">--</span><span class="countdown-label" data-label="minutes">분</span></div>
              <div class="countdown-unit"><span class="countdown-number" data-value="seconds">--</span><span class="countdown-label" data-label="seconds">초</span></div>
            </div>
            <p class="release-time"><time id="release-time" datetime="2026-10-11T17:00:00+09:00">2026. 10. 11. 17:00 · 한국 시간</time></p>
            <div class="countdown-status" role="status" aria-live="polite">
              <span id="countdown-message">시간을 확인하고 있어요.</span>
              <a id="countdown-retry" href="/" hidden>다시 확인</a>
            </div>
            <noscript><p class="countdown-noscript"><span lang="ko">자동 이동을 사용하려면 JavaScript를 켜 주세요.</span><br><span lang="en">Enable JavaScript for automatic redirection.</span><br><span lang="ja">自動転送にはJavaScriptを有効にしてください。</span><br><a href="/">새로고침 / Refresh / 再読み込み</a></p></noscript>
          </div>
        </div>
      </div>
      <div class="language-control" id="language-control" hidden>
        <button class="language-trigger" id="language-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
          <span id="language-current">한국어</span>
          <svg class="language-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg>
        </button>
        <div class="language-menu" id="language-menu" role="menu" aria-label="언어" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-language="ko" lang="ko"><span>한국어</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></button>
          <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-language="en" lang="en"><span>English</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></button>
          <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-language="ja" lang="ja"><span>日本語</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></button>
        </div>
      </div>
    </main>
  </body>
</html>
