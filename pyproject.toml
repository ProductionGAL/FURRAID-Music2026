[project]
name = "furraid-countdown"
version = "0.1.0"
description = "Server-timed FUR:RAID 2026 countdown and redirect"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["basedpyright>=1.21", "ruff>=0.8", "pytest>=8", "httpx2>=2"]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["server", "tests"]
exclude = [".venv", "**/__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
